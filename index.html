<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUBA.SUEDE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --red:#D0212A;
  --bg:#0A0A0A;
  --bg2:#111111;
  --bg3:#1A1A1A;
  --border:#2A2A2A;
  --text:#F0EDE8;
  --muted:#888;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
a{text-decoration:none;color:inherit}

/* HEADER */
header{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.header-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:60px;
  border-bottom:1px solid var(--border);
}
.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:4px;
  color:var(--text);
}
.logo span{color:var(--gold)}
.header-actions{display:flex;gap:1rem;align-items:center}
.btn-header{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);padding:6px 16px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.btn-header:hover{border-color:var(--gold);color:var(--gold)}
.btn-header.admin-active{border-color:var(--red);color:var(--red)}

/* SEARCH */
.search-bar{padding:1rem 2rem;background:var(--bg2)}
.search-wrap{position:relative;max-width:100%}
.search-wrap input{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:12px 20px 12px 48px;
  font-family:'Barlow',sans-serif;font-size:0.9rem;
  letter-spacing:1px;outline:none;transition:border .2s;
}
.search-wrap input::placeholder{color:var(--muted);letter-spacing:1px}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:1.1rem;
}
.search-clear{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--muted);cursor:pointer;font-size:1.2rem;
  display:none;background:none;border:none;color:var(--muted);
}

/* NAV CATEGORIES */
nav{
  display:flex;gap:0;overflow-x:auto;
  padding:0 2rem;background:var(--bg);
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
.nav-item{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.8rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);padding:14px 20px;
  border-bottom:2px solid transparent;
  cursor:pointer;transition:all .2s;white-space:nowrap;
  background:none;border-top:none;border-left:none;border-right:none;
}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);border-bottom-color:var(--red)}

/* MAIN */
main{padding:2rem;max-width:1400px;margin:0 auto}

/* SECTION HEADER */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.5rem;padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.section-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.8rem;letter-spacing:4px;text-transform:uppercase;
  color:var(--red);display:flex;align-items:center;gap:10px;
}
.section-title::before{content:'—';color:var(--red)}
.section-count{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:2px;color:var(--muted);
  text-transform:uppercase;
}

/* GRID */
.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:2px;
}

/* CARD */
.product-card{
  position:relative;background:var(--bg2);
  cursor:pointer;overflow:hidden;
  transition:transform .3s;
}
.product-card:hover{transform:scale(1.01)}
.card-img{
  width:100%;aspect-ratio:1;
  object-fit:cover;display:block;
  background:var(--bg3);
}
.card-img-placeholder{
  width:100%;aspect-ratio:1;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:3rem;color:var(--border);letter-spacing:2px;
}
.card-overlay{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.95));
  padding:2rem 1rem 1rem;
}
.card-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:1rem;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:var(--text);margin-bottom:2px;
}
.card-desc{
  font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.card-bottom{display:flex;justify-content:space-between;align-items:flex-end}
.card-price{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.4rem;color:var(--gold);letter-spacing:2px;
}
.card-sizes{display:flex;gap:4px;flex-wrap:wrap}
.size-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.6rem;letter-spacing:1px;
  border:1px solid var(--border);color:var(--muted);
  padding:2px 5px;text-transform:uppercase;
}
.card-fav{
  position:absolute;top:10px;right:10px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,0.6);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:0.9rem;
}
.card-fav:hover{border-color:var(--gold);background:rgba(201,168,76,0.2)}
.card-fav.active{border-color:var(--gold);color:var(--gold)}

/* WHATSAPP BTN */
.wa-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--red);color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;
  padding:8px 14px;cursor:pointer;
  border:none;transition:background .2s;width:100%;margin-top:8px;
  justify-content:center;
}
.wa-btn:hover{background:#b01c24}

/* NO RESULTS */
.no-results{
  text-align:center;padding:4rem;color:var(--muted);
  font-family:'Barlow Condensed',sans-serif;
  letter-spacing:3px;font-size:0.85rem;text-transform:uppercase;
}

/* MODAL PRODUCT */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.92);z-index:200;
  align-items:center;justify-content:center;padding:1rem;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border);
  max-width:800px;width:100%;max-height:90vh;overflow-y:auto;
  position:relative;
}
.modal-close{
  position:absolute;top:1rem;right:1rem;
  background:none;border:none;color:var(--muted);
  font-size:1.5rem;cursor:pointer;z-index:10;
}
.modal-close:hover{color:var(--text)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr}
.modal-img{width:100%;aspect-ratio:1;object-fit:cover}
.modal-img-placeholder{
  width:100%;aspect-ratio:1;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:4rem;color:var(--border);
}
.modal-info{padding:2rem}
.modal-cat{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.7rem;letter-spacing:3px;color:var(--red);
  text-transform:uppercase;margin-bottom:8px;
}
.modal-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.2rem;letter-spacing:3px;
  color:var(--text);line-height:1.1;margin-bottom:4px;
}
.modal-desc{font-size:0.85rem;color:var(--muted);margin-bottom:1.5rem;letter-spacing:1px}
.modal-price{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.8rem;color:var(--gold);letter-spacing:3px;margin-bottom:1.5rem;
}
.sizes-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.sizes-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2rem}
.size-btn{
  border:1px solid var(--border);background:none;
  color:var(--muted);padding:8px 14px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.size-btn:hover,.size-btn.selected{
  border-color:var(--gold);color:var(--gold);
  background:rgba(201,168,76,0.1);
}
.modal-wa{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--red);color:#fff;padding:14px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.85rem;letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;border:none;width:100%;transition:background .2s;
}
.modal-wa:hover{background:#b01c24}

/* ADMIN MODAL */
.admin-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.96);z-index:300;
  align-items:flex-start;justify-content:center;
  padding:2rem 1rem;overflow-y:auto;
}
.admin-modal.open{display:flex}
.admin-panel{
  background:var(--bg2);border:1px solid var(--border);
  width:100%;max-width:700px;padding:2rem;
}
.admin-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.8rem;letter-spacing:4px;color:var(--red);
  margin-bottom:2rem;
  border-bottom:1px solid var(--border);padding-bottom:1rem;
}
.form-group{margin-bottom:1rem}
.form-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;display:block;
}
.form-input{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:10px 14px;
  font-family:'Barlow',sans-serif;font-size:0.9rem;outline:none;
  transition:border .2s;
}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:var(--muted)}
select.form-input option{background:var(--bg2)}
.sizes-check{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.size-check-btn{
  border:1px solid var(--border);background:none;
  color:var(--muted);padding:6px 12px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.size-check-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.1)}
.btn-add{
  width:100%;background:var(--red);color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.85rem;letter-spacing:3px;text-transform:uppercase;
  padding:14px;border:none;cursor:pointer;transition:background .2s;
  margin-top:1rem;
}
.btn-add:hover{background:#b01c24}
.btn-cancel{
  width:100%;background:none;color:var(--muted);
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;
  padding:10px;border:1px solid var(--border);cursor:pointer;
  margin-top:8px;transition:all .2s;
}
.btn-cancel:hover{border-color:var(--muted);color:var(--text)}

/* LOGIN */
.login-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.96);z-index:300;
  align-items:center;justify-content:center;
}
.login-modal.open{display:flex}
.login-box{
  background:var(--bg2);border:1px solid var(--border);
  padding:3rem;max-width:360px;width:100%;text-align:center;
}
.login-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:4px;margin-bottom:4px;
}
.login-logo span{color:var(--gold)}
.login-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.7rem;letter-spacing:3px;color:var(--red);
  text-transform:uppercase;margin-bottom:2rem;
}
.login-err{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:2px;color:var(--red);
  margin-top:8px;display:none;
}

/* PRODUCT LIST IN ADMIN */
.admin-product-list{margin-top:2rem}
.admin-product-item{
  display:flex;align-items:center;gap:1rem;
  padding:12px;border:1px solid var(--border);
  margin-bottom:8px;background:var(--bg3);
}
.admin-product-thumb{
  width:60px;height:60px;object-fit:cover;background:var(--bg);
  flex-shrink:0;
}
.admin-product-info{flex:1}
.admin-product-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;
}
.admin-product-cat{font-size:0.7rem;color:var(--muted);letter-spacing:1px}
.admin-product-price{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.2rem;color:var(--gold);
}
.btn-delete{
  background:none;border:1px solid #3a1a1a;color:#666;
  padding:6px 10px;cursor:pointer;font-size:0.75rem;
  transition:all .2s;
}
.btn-delete:hover{border-color:var(--red);color:var(--red)}
.btn-edit-item{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:6px 10px;cursor:pointer;font-size:0.75rem;
  transition:all .2s;
}
.btn-edit-item:hover{border-color:var(--gold);color:var(--gold)}

/* TOAST */
.toast{
  position:fixed;bottom:2rem;right:2rem;
  background:var(--bg2);border:1px solid var(--gold);
  color:var(--gold);padding:12px 20px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;
  transform:translateY(100px);opacity:0;transition:all .3s;
  z-index:500;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--red);color:var(--red)}

/* TABS IN ADMIN */
.admin-tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.admin-tab{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);padding:10px 20px;cursor:pointer;
  border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  transition:all .2s;
}
.admin-tab.active{color:var(--red);border-bottom-color:var(--red)}
.admin-tab-content{display:none}
.admin-tab-content.active{display:block}

.img-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-preview img{width:80px;height:80px;object-fit:cover}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

@media(max-width:600px){
  .modal-grid{grid-template-columns:1fr}
  .header-top{padding:0 1rem}
  .search-bar{padding:0.75rem 1rem}
  nav{padding:0 1rem}
  main{padding:1rem}
  .products-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">KUBA<span>.</span>SUEDE</div>
    <div class="header-actions">
      <button class="btn-header" id="btn-admin-open">ADMIN</button>
      <button class="btn-header" id="btn-favorites" style="display:none">❤ FAVORITOS</button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Buscar producto..." autocomplete="off">
      <button class="search-clear" id="search-clear">✕</button>
    </div>
  </div>
  <nav id="nav-cats">
    <button class="nav-item active" data-cat="all">Todos</button>
    <button class="nav-item" data-cat="remeras">Remeras</button>
    <button class="nav-item" data-cat="pantalones">Pantalones</button>
    <button class="nav-item" data-cat="buzos">Buzos</button>
    <button class="nav-item" data-cat="outfits">Outfits</button>
    <button class="nav-item" data-cat="accesorios">Accesorios</button>
  </nav>
</header>

<main id="main-content">
  <div id="products-container"></div>
</main>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-grid">
      <div id="modal-img-wrap"></div>
      <div class="modal-info">
        <div class="modal-cat" id="modal-cat"></div>
        <div class="modal-name" id="modal-name"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <div class="modal-price" id="modal-price"></div>
        <div class="sizes-label">TALLES DISPONIBLES</div>
        <div class="sizes-grid" id="modal-sizes"></div>
        <button class="modal-wa" id="modal-wa-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.118.55 4.11 1.512 5.842L0 24l6.335-1.487A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.003-1.369l-.36-.214-3.724.875.944-3.642-.234-.374A9.791 9.791 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
          CONSULTAR POR WHATSAPP
        </button>
      </div>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="login-modal" id="login-modal">
  <div class="login-box">
    <div class="login-logo">KUBA<span>.</span>SUEDE</div>
    <div class="login-sub">Panel Administrador</div>
    <input type="password" class="form-input" id="admin-pass" placeholder="Contraseña" style="text-align:center;letter-spacing:4px;">
    <div class="login-err" id="login-err">Contraseña incorrecta</div>
    <button class="btn-add" style="margin-top:1rem" id="btn-login">INGRESAR</button>
    <button class="btn-cancel" id="btn-login-cancel">Cancelar</button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="admin-modal" id="admin-modal">
  <div class="admin-panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="admin-title">— ADMINISTRADOR</div>
      <button class="btn-cancel" style="width:auto;padding:6px 16px" id="btn-admin-close">SALIR</button>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="add">+ Agregar Producto</button>
      <button class="admin-tab" data-tab="list">📦 Productos</button>
    </div>

    <!-- TAB: ADD -->
    <div class="admin-tab-content active" id="tab-add">
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select class="form-input" id="f-cat">
          <option value="remeras">Remeras</option>
          <option value="pantalones">Pantalones</option>
          <option value="buzos">Buzos</option>
          <option value="outfits">Outfits</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Nombre del producto</label>
        <input class="form-input" id="f-name" placeholder="Ej: Remera Vestite Auténtico" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">Descripción corta</label>
        <input class="form-input" id="f-desc" placeholder="Ej: Washed Grey · Graphic" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">Precio (ARS)</label>
        <input class="form-input" id="f-price" placeholder="Ej: 12500" type="number">
      </div>
      <div class="form-group">
        <label class="form-label">URL de imagen (opcional, dejá vacío para imagen propia)</label>
        <input class="form-input" id="f-img" placeholder="https://..." type="url">
      </div>
      <div class="form-group">
        <label class="form-label">Talles disponibles</label>
        <div class="sizes-check" id="sizes-check">
          <button class="size-check-btn" data-size="XS">XS</button>
          <button class="size-check-btn" data-size="S">S</button>
          <button class="size-check-btn" data-size="M">M</button>
          <button class="size-check-btn" data-size="L">L</button>
          <button class="size-check-btn" data-size="XL">XL</button>
          <button class="size-check-btn" data-size="XXL">XXL</button>
          <button class="size-check-btn" data-size="ÚNICO">ÚNICO</button>
          <button class="size-check-btn" data-size="28">28</button>
          <button class="size-check-btn" data-size="30">30</button>
          <button class="size-check-btn" data-size="32">32</button>
          <button class="size-check-btn" data-size="34">34</button>
          <button class="size-check-btn" data-size="36">36</button>
          <button class="size-check-btn" data-size="38">38</button>
        </div>
      </div>
      <input type="hidden" id="edit-id" value="">
      <button class="btn-add" id="btn-save-product">+ AGREGAR AL CATÁLOGO</button>
      <button class="btn-cancel" id="btn-clear-form">Limpiar formulario</button>
    </div>

    <!-- TAB: LIST -->
    <div class="admin-tab-content" id="tab-list">
      <div id="admin-product-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const JSONBIN_ID = '6a1363ef6610dd3ae89c81c0';
const JSONBIN_KEY = '$2a$10$RQg1EkNL3CHWE8HhhC7jaefRdfYF40ZsFODe4SB8ogLKp7cX2NjDq';
const WA_NUMBER = '5493447460703';
const ADMIN_PASS = 'adminkubasuede';
const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

let products = [];
let currentCat = 'all';
let searchQuery = '';
let isAdmin = false;
let currentProduct = null;
let selectedModalSize = '';
let favorites = JSON.parse(localStorage.getItem('ks-favs') || '[]');

const CATS = {
  remeras:'Remeras',pantalones:'Pantalones',buzos:'Buzos',outfits:'Outfits',accesorios:'Accesorios'
};

async function loadProducts(){
  try{
    const r = await fetch(API_URL + '/latest', {
      headers:{'X-Master-Key': JSONBIN_KEY}
    });
    const d = await r.json();
    products = d.record.products || [];
    render();
  } catch(e){
    showToast('Error cargando productos','error');
    products = [];
    render();
  }
}

async function saveProducts(){
  try{
    await fetch(API_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key': JSONBIN_KEY},
      body: JSON.stringify({products})
    });
    showToast('Guardado ✓');
    render();
    renderAdminList();
  } catch(e){
    showToast('Error al guardar','error');
  }
}

function getFiltered(){
  return products.filter(p=>{
    const catOk = currentCat==='all' || p.category===currentCat;
    const q = searchQuery.toLowerCase();
    const searchOk = !q || p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q);
    return catOk && searchOk;
  });
}

function groupByCategory(list){
  const g = {};
  list.forEach(p=>{
    if(!g[p.category]) g[p.category]=[];
    g[p.category].push(p);
  });
  return g;
}

function render(){
  const filtered = getFiltered();
  const container = document.getElementById('products-container');
  if(!filtered.length){
    container.innerHTML = '<div class="no-results">— Sin resultados —</div>';
    return;
  }
  if(currentCat!=='all'){
    container.innerHTML = `
      <div class="section-header">
        <div class="section-title">${CATS[currentCat]||currentCat}</div>
        <div class="section-count">${filtered.length} producto${filtered.length!==1?'s':''}</div>
      </div>
      <div class="products-grid">${filtered.map(cardHTML).join('')}</div>
    `;
  } else {
    const groups = groupByCategory(filtered);
    container.innerHTML = Object.entries(groups).map(([cat,items])=>`
      <div style="margin-bottom:3rem">
        <div class="section-header">
          <div class="section-title">${CATS[cat]||cat}</div>
          <div class="section-count">${items.length} producto${items.length!==1?'s':''}</div>
        </div>
        <div class="products-grid">${items.map(cardHTML).join('')}</div>
      </div>
    `).join('');
  }

  document.querySelectorAll('.product-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.classList.contains('card-fav') || e.target.closest('.card-fav')) return;
      openProduct(card.dataset.id);
    });
  });
  document.querySelectorAll('.card-fav').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      toggleFav(btn.dataset.id);
    });
  });
  document.querySelectorAll('.wa-card-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const p = products.find(x=>x.id===btn.dataset.id);
      if(p) openWA(p, '');
    });
  });
}

function cardHTML(p){
  const isFav = favorites.includes(p.id);
  const imgTag = p.img
    ? `<img class="card-img" src="${p.img}" alt="${p.name}" loading="lazy">`
    : `<div class="card-img-placeholder">KS</div>`;
  return `
    <div class="product-card" data-id="${p.id}">
      ${imgTag}
      <div class="card-fav ${isFav?'active':''}" data-id="${p.id}">${isFav?'♥':'♡'}</div>
      <div class="card-overlay">
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc||''}</div>
        <div class="card-bottom">
          <div class="card-price">$${Number(p.price).toLocaleString('es-AR')}</div>
          <div class="card-sizes">${(p.sizes||[]).slice(0,4).map(s=>`<span class="size-tag">${s}</span>`).join('')}</div>
        </div>
        <button class="wa-btn wa-card-btn" data-id="${p.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.118.55 4.11 1.512 5.842L0 24l6.335-1.487A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.003-1.369l-.36-.214-3.724.875.944-3.642-.234-.374A9.791 9.791 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
          CONSULTAR
        </button>
      </div>
    </div>`;
}

function openProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  currentProduct = p;
  selectedModalSize = '';
  document.getElementById('modal-cat').textContent = CATS[p.category]||p.category;
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-desc').textContent = p.desc||'';
  document.getElementById('modal-price').textContent = '$'+Number(p.price).toLocaleString('es-AR');
  const imgWrap = document.getElementById('modal-img-wrap');
  imgWrap.innerHTML = p.img
    ? `<img class="modal-img" src="${p.img}" alt="${p.name}">`
    : `<div class="modal-img-placeholder">KS</div>`;
  const sizesEl = document.getElementById('modal-sizes');
  sizesEl.innerHTML = (p.sizes||[]).map(s=>
    `<button class="size-btn" data-size="${s}">${s}</button>`
  ).join('');
  sizesEl.querySelectorAll('.size-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      sizesEl.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedModalSize = btn.dataset.size;
    });
  });
  document.getElementById('product-modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function openWA(p, size){
  const sizeText = size ? ` - Talle: ${size}` : '';
  const msg = encodeURIComponent(`Hola! Me interesa: *${p.name}*${sizeText}\nPrecio: $${Number(p.price).toLocaleString('es-AR')}`);
  window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`,'_blank');
}

function toggleFav(id){
  const i = favorites.indexOf(id);
  if(i>=0) favorites.splice(i,1);
  else favorites.push(id);
  localStorage.setItem('ks-favs', JSON.stringify(favorites));
  render();
}

function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type==='error'?' error':'');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function renderAdminList(){
  const el = document.getElementById('admin-product-list');
  if(!products.length){
    el.innerHTML = '<div style="color:var(--muted);font-family:Barlow Condensed,sans-serif;letter-spacing:2px;font-size:0.8rem;text-transform:uppercase;padding:1rem 0">Sin productos</div>';
    return;
  }
  el.innerHTML = products.map(p=>`
    <div class="admin-product-item">
      ${p.img?`<img class="admin-product-thumb" src="${p.img}" alt="${p.name}">`:`<div class="admin-product-thumb" style="display:flex;align-items:center;justify-content:center;font-family:Bebas Neue,sans-serif;color:var(--border);font-size:1.2rem">KS</div>`}
      <div class="admin-product-info">
        <div class="admin-product-name">${p.name}</div>
        <div class="admin-product-cat">${CATS[p.category]||p.category} · ${(p.sizes||[]).join(', ')}</div>
      </div>
      <div class="admin-product-price">$${Number(p.price).toLocaleString('es-AR')}</div>
      <button class="btn-edit-item" data-id="${p.id}">EDITAR</button>
      <button class="btn-delete" data-id="${p.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.btn-delete').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm('¿Eliminar este producto?')) return;
      products = products.filter(p=>p.id!==btn.dataset.id);
      await saveProducts();
    });
  });
  el.querySelectorAll('.btn-edit-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p = products.find(x=>x.id===btn.dataset.id);
      if(!p) return;
      document.getElementById('f-cat').value = p.category;
      document.getElementById('f-name').value = p.name;
      document.getElementById('f-desc').value = p.desc||'';
      document.getElementById('f-price').value = p.price;
      document.getElementById('f-img').value = p.img||'';
      document.getElementById('edit-id').value = p.id;
      document.querySelectorAll('.size-check-btn').forEach(b=>{
        b.classList.toggle('active',(p.sizes||[]).includes(b.dataset.size));
      });
      switchTab('add');
      document.getElementById('btn-save-product').textContent = '✓ GUARDAR CAMBIOS';
    });
  });
}

function switchTab(name){
  document.querySelectorAll('.admin-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.admin-tab-content').forEach(t=>t.classList.toggle('active',t.id==='tab-'+name));
  if(name==='list') renderAdminList();
}

function clearForm(){
  document.getElementById('f-cat').value='remeras';
  document.getElementById('f-name').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-price').value='';
  document.getElementById('f-img').value='';
  document.getElementById('edit-id').value='';
  document.querySelectorAll('.size-check-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-save-product').textContent='+ AGREGAR AL CATÁLOGO';
}

// Events
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById('search-input').addEventListener('input',e=>{
  searchQuery = e.target.value;
  document.getElementById('search-clear').style.display = searchQuery?'block':'none';
  render();
});
document.getElementById('search-clear').addEventListener('click',()=>{
  document.getElementById('search-input').value='';
  searchQuery='';
  document.getElementById('search-clear').style.display='none';
  render();
});

document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('product-modal').classList.remove('open');
  document.body.style.overflow='';
});
document.getElementById('product-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('product-modal')){
    document.getElementById('product-modal').classList.remove('open');
    document.body.style.overflow='';
  }
});
document.getElementById('modal-wa-btn').addEventListener('click',()=>{
  if(currentProduct) openWA(currentProduct, selectedModalSize);
});

document.getElementById('btn-admin-open').addEventListener('click',()=>{
  document.getElementById('login-modal').classList.add('open');
  setTimeout(()=>document.getElementById('admin-pass').focus(),100);
});
document.getElementById('btn-login-cancel').addEventListener('click',()=>{
  document.getElementById('login-modal').classList.remove('open');
  document.getElementById('admin-pass').value='';
  document.getElementById('login-err').style.display='none';
});
document.getElementById('btn-login').addEventListener('click',()=>{
  const pass = document.getElementById('admin-pass').value;
  if(pass===ADMIN_PASS){
    document.getElementById('login-modal').classList.remove('open');
    document.getElementById('admin-modal').classList.add('open');
    document.body.style.overflow='hidden';
    document.getElementById('admin-pass').value='';
    document.getElementById('btn-admin-open').classList.add('admin-active');
    document.getElementById('btn-admin-open').textContent='ADMIN ✓';
    isAdmin=true;
    renderAdminList();
  } else {
    document.getElementById('login-err').style.display='block';
  }
});
document.getElementById('admin-pass').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('btn-login').click();
});

document.getElementById('btn-admin-close').addEventListener('click',()=>{
  document.getElementById('admin-modal').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('btn-admin-open').classList.remove('admin-active');
  document.getElementById('btn-admin-open').textContent='ADMIN';
  isAdmin=false;
});

document.querySelectorAll('.admin-tab').forEach(tab=>{
  tab.addEventListener('click',()=>switchTab(tab.dataset.tab));
});

document.querySelectorAll('.size-check-btn').forEach(btn=>{
  btn.addEventListener('click',()=>btn.classList.toggle('active'));
});

document.getElementById('btn-clear-form').addEventListener('click', clearForm);

document.getElementById('btn-save-product').addEventListener('click', async()=>{
  const name = document.getElementById('f-name').value.trim();
  const price = document.getElementById('f-price').value.trim();
  if(!name||!price){showToast('Nombre y precio son obligatorios','error');return;}
  const sizes = [...document.querySelectorAll('.size-check-btn.active')].map(b=>b.dataset.size);
  const editId = document.getElementById('edit-id').value;
  const prod = {
    id: editId || Date.now().toString(),
    category: document.getElementById('f-cat').value,
    name,
    desc: document.getElementById('f-desc').value.trim(),
    price: Number(price),
    img: document.getElementById('f-img').value.trim() || '',
    sizes
  };
  if(editId){
    const i = products.findIndex(p=>p.id===editId);
    if(i>=0) products[i]=prod;
  } else {
    products.push(prod);
  }
  await saveProducts();
  clearForm();
  switchTab('list');
});

loadProducts();
</script>
</body>
</html>
